# Repository secret scanning, as required by the secret-handling audit.
#
# This is a workflow of its own rather than a job in ci.yml for two
# reasons. It needs a trigger set ci.yml does not have -- the audit
# asks for pull requests *and* pushes to the default branch, because a
# secret that reaches develop without a pull request still needs
# finding. And it is a content scanner: its whole point is to read the
# human-written text a path filter would skip, since a credential
# lands in docs/ or a plan as easily as in a script.
#
# Copied from shakenfist/development's own .github/workflows/secret-scan.yml
# (there is no templates/ copy of this one). The changes are the
# default branch below -- this repository's is develop, not main -- and
# the merge_group trigger and concurrency key that this repository's
# merge queue needs.
#
# Reference invocation: shakenfist/development/docs/audits/secret-handling.md
name: Secret scan

on:
  pull_request:
  push:
    branches: [develop]
  # gitleaks is a required status check on develop, and develop merges
  # through a merge queue, which waits for every required check to
  # report on the queue entry. Without this trigger the queue would wait
  # forever.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # gitleaks-action@v2 refuses to run on organization repositories
  # without a paid licence, so the upstream binary is invoked directly.
  # gitleaks is only packaged from Debian 13 (trixie) onward -- bookworm
  # has no package -- so this job needs a debian-13 runner.
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, vm, debian-13, s]
    timeout-minutes: 15
    # On a merge group, key on the base branch rather than github.ref,
    # which is a new queue branch on every rebuild, so a superseded run
    # is cancelled. That is safe because the queue is serial
    # (max_entries_to_build: 1): any other first attempt of a
    # merge_group run has already been abandoned. A re-run is not a
    # queue build, though. It keeps its original event, so with the
    # base-branch key a "Re-run jobs" on an old queue run would cancel
    # the live queue entry or be cancelled by it. Re-runs therefore keep
    # their own queue branch's group. The merge_group- prefix keeps a
    # queue run out of a workflow_dispatch run's group on develop, whose
    # github.ref is the same string. A push to develop is keyed by its
    # sha, so that each commit's scan runs to completion rather than
    # being cancelled by the next push.
    concurrency:
      group: >-
        ${{ github.workflow }}-gitleaks-${{
        github.event_name == 'merge_group' && github.run_attempt == '1'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.event_name == 'push' && github.sha
        || github.ref }}
      cancel-in-progress: true
    steps:
      # fetch-depth: 0 matters. A secret committed and then reverted is
      # still in the history and still needs rotating; a shallow clone
      # reports a clean history it never looked at.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks

      # --log-opts="HEAD" scopes the scan to this branch and the history
      # behind it. Without it gitleaks scans every ref, which is not what
      # anyone means by "scan this project's history", and 8.16
      # misattributes the findings to unrelated merge commits so they
      # cannot be triaged either.
      - name: Run gitleaks
        run: >-
          gitleaks detect --source . --log-opts="HEAD" --redact
          --verbose --no-banner
