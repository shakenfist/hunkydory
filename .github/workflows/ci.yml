# CI for hunkydory.
#
# Two jobs because the two failures are different. build-test-lint
# exercises tools/check-node.sh -- the build, the unit tests and Biome
# -- which is exactly what pre-commit runs locally, so this job cannot
# drift from what a contributor sees before pushing. pre-commit runs
# every hook in .pre-commit-config.yaml (shellcheck, gitleaks,
# skillsaw and check-node itself), which is what closes the CI half of
# the fleet's llm-context-lint-ci criterion: a hook nobody remembers to
# `pre-commit install` for still gates a pull request.
#
# npm_config_cache is pointed at runner.temp on both jobs. The static
# runners are a shared, non-ephemeral pool -- other repositories run on
# the same machine -- so a job writing the default ~/.npm would pollute
# state those repositories depend on. runner.temp is per-job and
# per-runner, so it never leaks between jobs or repositories.
#
# npm ci, not npm install: the lockfile is committed, and the fleet's
# npm-pin-indirect-dependencies criterion checks that CI honours it.
#
# Neither job runs for a pull request from a fork. Both check out the
# pull request's own code and then execute it -- its package-lock.json
# through npm ci, and its .pre-commit-config.yaml through pre-commit,
# which fetches and runs hooks the pull request names -- on
# [self-hosted, static], the shared non-ephemeral pool every repository
# in both the shakenfist and mach33labs organisations runs on. Opening
# a fork pull request needs no permission at all, so without the guard
# that is arbitrary code execution on a machine other repositories'
# jobs land on next, offered to anyone with a GitHub account.
#
# pr-re-review.yml carries the same restriction for the same reason,
# there as same-repo from pr-bot-trigger, which an issue_comment event
# needs; a pull_request event can compare the head repository against
# this one directly, which is how the fleet's
# pin-indirect-dependencies.yml spells it.
#
# Like both of those, this guards against outsiders and accident
# rather than being a trust boundary against someone who already has
# write access: for a pull_request event the workflow is read from the
# pull request's own copy, so an author who can push a branch here can
# edit the guard. Branch protection is the server-side control for
# that, not this line.
#
# The consequence to know about: a fork pull request gets no CI at all,
# and has to be pushed as a branch in this repository before anything
# tests it.
#
# Review-only changes -- weAudit marks, their shas sidecars, the scope
# config and the rendered REVIEWS.md -- cannot change what either job
# checks, and the daily prune-reviews run commits exactly those files.
# Both jobs are required status checks on develop, so pull requests
# skip them at the job level through check_paths below rather than
# with a trigger-level paths-ignore: a workflow that never starts never
# reports its required checks, and the pull request waits on them
# forever, whereas a skipped job satisfies a required check. push
# carries no required checks, so it can use paths-ignore directly.
# Keep both path lists in sync with codeql-analysis.yml's copies.
#
# secret-scan.yml deliberately has neither. gitleaks exists to read
# human-written text, and a review note is prose, which is exactly
# where a secret lands as easily as in code.
name: CI

on:
  pull_request:
  push:
    branches: [develop]
    paths-ignore:
      - 'REVIEWS.md'
      - '.vscode/*.weaudit'
      - '.vscode/*.weaudit-shas.json'
      - '.vscode/review-scope.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detect review-only pull requests so the two jobs below can skip
  # them. For every other event the filter step is skipped and the
  # output defaults to code_changed=true: push is already filtered by
  # paths-ignore above, and workflow_dispatch has no pull request to
  # diff, so both run everything.
  check_paths:
    name: "Check paths"
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    # paths-filter reads the changed-file list from pulls.listFiles
    # rather than from the working tree, and the top-level permissions
    # block sets every scope it does not name to none.
    permissions:
      pull-requests: read
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      # There is deliberately no checkout step. On a pull_request
      # event paths-filter asks the API for the changed files and never
      # looks at the working tree, so a fork's content never reaches
      # the shared static pool -- which is why this job, unlike the two
      # below, carries no fork guard.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # By default a file matches the filter if it matches ANY
          # listed pattern, which makes '**' match everything and
          # silently defeats the '!REVIEWS.md' style exclusions. 'every'
          # requires a file to match ALL patterns, which is the correct
          # semantics for an "everything except the review artefacts"
          # filter.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!REVIEWS.md'
              - '!.vscode/*.weaudit'
              - '!.vscode/*.weaudit-shas.json'
              - '!.vscode/review-scope.toml'

  build-test-lint:
    name: Build, test and lint
    # No fork pull requests on the shared pool; see the header.
    #
    # !cancelled() makes the path filter fail open. A job whose
    # dependency did not succeed is skipped by default, and a skipped
    # required check reads as green -- so without it a transient
    # failure of check_paths would merge a pull request that was never
    # built. A failed check_paths yields no output, an empty output is
    # != 'false', and the job runs. Only a filter that positively said
    # 'false' skips it.
    needs: [check_paths]
    if: |
      !cancelled()
      && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, static]
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-test-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # The runner context is not available in a job-level env: block
      # (actionlint catches this; GitHub's own context-availability
      # table confirms it), so the cache path is exported to
      # GITHUB_ENV instead, from a step where the context is valid.
      # Every later step in this job inherits it.
      - name: Point npm's cache at runner.temp
        run: echo "npm_config_cache=${{ runner.temp }}/npm-cache" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build, test and Biome
        run: tools/check-node.sh check

      # Not part of check-node.sh, which is also the pre-commit hook: this
      # runs vsce over the built output, which needs devDependencies
      # installed and takes seconds rather than milliseconds. What it
      # catches -- an allow-list in .vscodeignore that drops a compiled
      # module from the package -- is invisible until a user installs the
      # extension, so it belongs somewhere that runs on every pull request
      # rather than nowhere.
      - name: Check what the .vsix would contain
        run: tools/check-package-contents.sh

  pre-commit:
    name: Pre-commit hooks
    # No fork pull requests on the shared pool, and the path filter
    # fails open; see the header and build-test-lint.
    needs: [check_paths]
    if: |
      !cancelled()
      && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, static]
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-pre-commit
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # See the same step in build-test-lint: a job-level env: block
      # cannot see the runner context.
      - name: Point npm's cache at runner.temp
        run: echo "npm_config_cache=${{ runner.temp }}/npm-cache" >> "$GITHUB_ENV"

      # The check-node hook shells out to `npm run build` and
      # `npm test`, so node_modules has to exist before pre-commit runs
      # it -- pre-commit itself only manages its own Python/Go/etc.
      # hook environments, not this repository's own npm install.
      - name: Install dependencies
        run: npm ci

      # A venv for the same reason development's own ci.yml uses one:
      # the runners enforce PEP 668 and refuse a bare `pip install`.
      #
      # It lives under runner.temp rather than at a fixed /tmp path,
      # for the same reason npm's cache does. development's ci.yml
      # uses /tmp/venv-lint, and on a shared non-ephemeral pool that
      # races: two jobs on one runner share the path, and whichever
      # finishes first deletes the venv the other is still running
      # from. The concurrency group above does not help, because it
      # scopes to this workflow and ref rather than to the machine.
      # runner.temp is per job, so there is nothing to collide with.
      - name: Install pre-commit
        run: |
          python3 -m venv "${{ runner.temp }}/venv-lint"
          "${{ runner.temp }}/venv-lint/bin/pip" install --quiet \
              --disable-pip-version-check pre-commit

      # The venv's bin goes on PATH rather than the hooks being run
      # through an absolute path. Quoting that path would put a `"`
      # between "pre-commit" and "run", and the fleet's
      # llm-context-lint-ci criterion looks for `pre-commit\s+run` in a
      # workflow to decide this repository lints its agent context in
      # CI. Leaving the path unquoted instead would match, but only by
      # being sloppy about a path that happens not to contain spaces.
      - name: Run pre-commit hooks
        run: |
          export PATH="${{ runner.temp }}/venv-lint/bin:$PATH"
          pre-commit run --all-files --show-diff-on-failure
