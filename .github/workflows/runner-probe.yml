# Throwaway probe for step 7a.6 of shakenfist/development's
# PLAN-typescript-onboarding.md.
#
# Phase 7's release.yml runs the Marketplace publish job on
# [self-hosted, vm, debian-13, s], but nothing establishes that this
# lane carries node and npm -- phase 4 only put them on the static
# pool. The publish job is behind a tag-and-environment dispatch
# guard, so it cannot answer that question itself until phase 7b. This
# workflow answers it now, from a job that holds no secret, so 7b.0
# can decide with the fact rather than around it.
#
# Deliberately carries no `environment:` key: that is what keeps this
# job unable to reach any secret, and it is the whole reason dispatching
# it is safe. `secret-scan.yml` already uses this lane and
# workflow_dispatch, so no new label is needed in .github/actionlint.yaml.
#
# Delete this workflow once the answer is recorded in that plan's
# "Open question: does the publish lane have node?" section -- it is a
# probe, not a fixture.

name: Runner probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: probe
    runs-on: [self-hosted, vm, debian-13, s]
    timeout-minutes: 5
    steps:
      - name: Check for node and npm
        run: |
          node --version || echo "node: absent"
          npm --version || echo "npm: absent"
          command -v node npm || echo "neither on PATH"
