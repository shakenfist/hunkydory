# CI for hunkydory.
#
# Two test jobs because the two failures are different. build-test-lint
# exercises tools/check-node.sh -- the build, the unit tests and Biome
# -- which is exactly what pre-commit runs locally, so this job cannot
# drift from what a contributor sees before pushing. pre-commit runs
# every hook in .pre-commit-config.yaml (shellcheck, gitleaks,
# skillsaw and check-node itself), which is what closes the CI half of
# the fleet's llm-context-lint-ci criterion: a hook nobody remembers to
# `pre-commit install` for still gates a pull request.
#
# npm_config_cache is pointed at runner.temp on both jobs. The static
# runners are a shared, non-ephemeral pool -- other repositories run on
# the same machine -- so a job writing the default ~/.npm would pollute
# state those repositories depend on. runner.temp is per-job and
# per-runner, so it never leaks between jobs or repositories.
#
# npm ci, not npm install: the lockfile is committed, and the fleet's
# npm-pin-indirect-dependencies criterion checks that CI honours it.
#
# Neither job runs for a pull request from a fork. Both check out the
# pull request's own code and then execute it -- its package-lock.json
# through npm ci, and its .pre-commit-config.yaml through pre-commit,
# which fetches and runs hooks the pull request names -- on
# [self-hosted, static], the shared non-ephemeral pool every repository
# in both the shakenfist and mach33labs organisations runs on. Opening
# a fork pull request needs no permission at all, so without the guard
# that is arbitrary code execution on a machine other repositories'
# jobs land on next, offered to anyone with a GitHub account.
#
# pr-re-review.yml carries the same restriction for the same reason,
# there as same-repo from pr-bot-trigger, which an issue_comment event
# needs; a pull_request event can compare the head repository against
# this one directly, which is how the fleet's
# pin-indirect-dependencies.yml spells it.
#
# Like both of those, this guards against outsiders and accident
# rather than being a trust boundary against someone who already has
# write access: for a pull_request event the workflow is read from the
# pull request's own copy, so an author who can push a branch here can
# edit the guard. Branch protection is the server-side control for
# that, not this line.
#
# The consequence to know about: a fork pull request gets no CI on the
# pull request at all. The merge queue is where it is first tested. The
# guard only stops pull_request events, so enqueueing a fork's pull
# request runs all of its code -- workflows, package-lock.json and the
# pre-commit config -- on the static pool. For a merge queue entry,
# enqueueing is the approval; see docs/development.md.
#
# Review-only changes -- weAudit marks, their shas sidecars, the scope
# config and the rendered REVIEWS.md -- cannot change what either job
# checks, and the daily prune-reviews run commits exactly those files.
# The jobs back required status checks on develop, so pull requests
# skip them at the job level through check_paths below rather than
# with a trigger-level paths-ignore: a workflow that never starts never
# reports its required checks, and the pull request waits on them
# forever, whereas a skipped job satisfies a required check. A merge
# queue entry is not filtered, so every job runs on every entry, which
# is what lets "Can merge" require each of them to succeed, and what
# makes a review-only merge releasable. Keep the path list in sync with
# codeql-analysis.yml's copy.
#
# secret-scan.yml deliberately has no filter. gitleaks exists to read
# human-written text, and a review note is prose, which is exactly
# where a secret lands as easily as in code.
#
# The third job, automated_reviewer, posts the fleet's automatic Claude
# review. Its body is the reusable pr-auto-review.yml in
# shakenfist/actions, which already refuses anything but a same-repo
# pull_request; what this file decides is when to ask. It asks only
# for a pull_request, stating that here as well as in the shared
# workflow for the reason pr-re-review.yml repeats its fork guard: a
# regression in shakenfist/actions should not quietly widen what runs
# here. It asks only once both jobs above have passed: a review of
# code that does not build is wasted on the scarce claude-code runner,
# and so is one of a review-only change, where both jobs were skipped.
# A fork pull request needs no check of its own, since both jobs skip
# it and so never report success. It is not a required check, so
# skipping it never holds a pull request up.
#
# The last two jobs, "Can enqueue" and "Can merge", collect the others
# into the two checks the merge queue's ruleset requires.
name: CI

on:
  pull_request:
  # Merges go through a merge queue, so every commit that lands on
  # develop is the commit a merge_group run tested, even when its base
  # moved after the pull request run. That run is the one release.yml's
  # CI gate counts, which is why there is no push trigger: it would
  # only test the same commit a second time.
  merge_group:
  # pr-retest.yml re-runs this workflow by dispatching it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detect review-only pull requests so the jobs below can skip them.
  # For every other event the filter step is skipped and the output
  # defaults to code_changed=true, so merge queue entries and
  # workflow_dispatch both run everything. A merge queue entry is the
  # run a release counts, and "Can merge" requires every job to have
  # succeeded on it, so it is deliberately not filtered.
  check_paths:
    name: "Check paths"
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    # paths-filter reads the changed-file list from pulls.listFiles
    # rather than from the working tree, and the top-level permissions
    # block sets every scope it does not name to none.
    permissions:
      pull-requests: read
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      # There is deliberately no checkout step. On a pull_request
      # event paths-filter asks the API for the changed files and never
      # looks at the working tree, so a fork's content never reaches
      # the shared static pool -- which is why this job, unlike the two
      # below, carries no fork guard.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # By default a file matches the filter if it matches ANY
          # listed pattern, which makes '**' match everything and
          # silently defeats the '!REVIEWS.md' style exclusions. 'every'
          # requires a file to match ALL patterns, which is the correct
          # semantics for an "everything except the review artefacts"
          # filter.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!REVIEWS.md'
              - '!.vscode/*.weaudit'
              - '!.vscode/*.weaudit-shas.json'
              - '!.vscode/review-scope.toml'

  build-test-lint:
    name: Build, test and lint
    # No fork pull requests on the shared pool; see the header.
    #
    # !cancelled() makes the path filter fail open. A job whose
    # dependency did not succeed is skipped by default, and a skipped
    # required check reads as green -- so without it a transient
    # failure of check_paths would merge a pull request that was never
    # built. A failed check_paths yields no output, an empty output is
    # != 'false', and the job runs. Only a filter that positively said
    # 'false' skips it.
    needs: [check_paths]
    if: |
      !cancelled()
      && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, static]
    permissions:
      contents: read
    timeout-minutes: 15
    # On a merge group, key on the base branch rather than github.ref,
    # which is a new queue branch on every rebuild, so a superseded run
    # is cancelled. That is safe because the queue is serial
    # (max_entries_to_build: 1): any other first attempt of a
    # merge_group run has already been abandoned. A re-run is not a
    # queue build, though. It keeps its original event, so with the
    # base-branch key a "Re-run jobs" on an old queue run, the release
    # recovery in docs/development.md, would cancel the live queue entry
    # or be cancelled by it. Re-runs therefore keep their own queue
    # branch's group. The merge_group- prefix keeps a queue run out of a
    # workflow_dispatch run's group on develop, whose github.ref is the
    # same string.
    concurrency:
      group: >-
        ${{ github.workflow }}-build-test-lint-${{
        github.event_name == 'merge_group' && github.run_attempt == '1'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # The runner context is not available in a job-level env: block
      # (actionlint catches this; GitHub's own context-availability
      # table confirms it), so the cache path is exported to
      # GITHUB_ENV instead, from a step where the context is valid.
      # Every later step in this job inherits it.
      - name: Point npm's cache at runner.temp
        run: echo "npm_config_cache=${{ runner.temp }}/npm-cache" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build, test and Biome
        run: tools/check-node.sh check

      # Not part of check-node.sh, which is also the pre-commit hook: this
      # runs vsce over the built output, which needs devDependencies
      # installed and takes seconds rather than milliseconds. What it
      # catches -- an allow-list in .vscodeignore that drops a compiled
      # module from the package -- is invisible until a user installs the
      # extension, so it belongs somewhere that runs on every pull request
      # rather than nowhere.
      - name: Check what the .vsix would contain
        run: tools/check-package-contents.sh

  pre-commit:
    name: Pre-commit hooks
    # No fork pull requests on the shared pool, and the path filter
    # fails open; see the header and build-test-lint.
    needs: [check_paths]
    if: |
      !cancelled()
      && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, static]
    permissions:
      contents: read
    timeout-minutes: 15
    # Keyed as build-test-lint's is, for the reasons given there.
    concurrency:
      group: >-
        ${{ github.workflow }}-pre-commit-${{
        github.event_name == 'merge_group' && github.run_attempt == '1'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # See the same step in build-test-lint: a job-level env: block
      # cannot see the runner context.
      - name: Point npm's cache at runner.temp
        run: echo "npm_config_cache=${{ runner.temp }}/npm-cache" >> "$GITHUB_ENV"

      # The check-node hook shells out to `npm run build` and
      # `npm test`, so node_modules has to exist before pre-commit runs
      # it -- pre-commit itself only manages its own Python/Go/etc.
      # hook environments, not this repository's own npm install.
      - name: Install dependencies
        run: npm ci

      # A venv for the same reason development's own ci.yml uses one:
      # the runners enforce PEP 668 and refuse a bare `pip install`.
      #
      # It lives under runner.temp rather than at a fixed /tmp path,
      # for the same reason npm's cache does. development's ci.yml
      # uses /tmp/venv-lint, and on a shared non-ephemeral pool that
      # races: two jobs on one runner share the path, and whichever
      # finishes first deletes the venv the other is still running
      # from. The concurrency group above does not help, because it
      # scopes to this workflow and ref rather than to the machine.
      # runner.temp is per job, so there is nothing to collide with.
      - name: Install pre-commit
        run: |
          python3 -m venv "${{ runner.temp }}/venv-lint"
          "${{ runner.temp }}/venv-lint/bin/pip" install --quiet \
              --disable-pip-version-check pre-commit

      # The venv's bin goes on PATH rather than the hooks being run
      # through an absolute path. Quoting that path would put a `"`
      # between "pre-commit" and "run", and the fleet's
      # llm-context-lint-ci criterion looks for `pre-commit\s+run` in a
      # workflow to decide this repository lints its agent context in
      # CI. Leaving the path unquoted instead would match, but only by
      # being sloppy about a path that happens not to contain spaces.
      - name: Run pre-commit hooks
        run: |
          export PATH="${{ runner.temp }}/venv-lint/bin:$PATH"
          pre-commit run --all-files --show-diff-on-failure

  # The tests that need a real VS Code: undo and redo, and the editor's
  # recount against recountText over edited patches. Its own job because
  # it needs a display, Electron's libraries and a VS Code install, which
  # tools/editor-test-docker.sh brings in a container, and because that
  # container starts Electron with --no-sandbox. So it runs on the
  # ephemeral docker lane release.yml uses rather than on static, whose
  # state outlives the job. Not a dependency of automated_reviewer: a
  # review is worth having before this slower job finishes.
  editor-tests:
    name: Editor tests
    # No fork pull requests, and the path filter fails open; see the
    # header and build-test-lint.
    needs: [check_paths]
    if: |
      !cancelled()
      && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, vm, debian-13-docker, s]
    permissions:
      contents: read
    timeout-minutes: 20
    # Keyed as build-test-lint's is, for the reasons given there.
    concurrency:
      group: >-
        ${{ github.workflow }}-editor-tests-${{
        github.event_name == 'merge_group' && github.run_attempt == '1'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the editor tests in a container
        run: tools/editor-test-docker.sh

  automated_reviewer:
    name: "Automated reviewer"
    needs: [build-test-lint, pre-commit]
    # Explicit results rather than the default success(): the jobs
    # above run through !cancelled(), and only a positive pass from
    # both should spend a review. See the header.
    if: |
      github.event_name == 'pull_request'
      && !cancelled()
      && needs.build-test-lint.result == 'success'
      && needs.pre-commit.result == 'success'
    # A cross-repository reusable workflow cannot grant itself more
    # token scope than its caller has, so the permissions go here. No
    # secrets: inherit -- the reviewer authenticates with github.token
    # and reads no secret, so inheriting would only hand this
    # repository's secrets to a workflow in another repository.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main

  # The two checks the merge queue's ruleset requires, collecting this
  # workflow's jobs into one result each, in the shape described at
  # https://boinkor.net/2023/11/neat-github-actions-patterns-for-github-merge-queues/
  # "Can enqueue" reports on pull requests and "Can merge" on merge
  # queue entries; each is skipped, which GitHub treats as success, on
  # the other event. The automated reviewer is advisory and
  # deliberately not in needs: it must not be able to block a merge on
  # an API hiccup.
  can-enqueue:
    name: "Can enqueue"
    needs:
      - check_paths
      - build-test-lint
      - pre-commit
      - editor-tests
    if: ${{ !cancelled() && github.event_name != 'merge_group' }}
    # The steps read only the needs context, so the token needs nothing.
    permissions: {}
    runs-on: [self-hosted, static]
    timeout-minutes: 5
    steps:
      # build-test-lint, pre-commit and editor-tests may be skipped here,
      # because on a pull request each is skipped by design: for a
      # review-only change, through check_paths, and for a fork, through
      # the guard described in the header. Neither skip reaches a
      # release, because "Can merge" requires all three on the queue
      # entry. check_paths itself must succeed.
      - name: Transform outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "ALL_SUCCESS=$(echo "${NEEDS_JSON}" | jq 'to_entries | map(.value.result == "success" or (.key != "check_paths" and .value.result == "skipped")) | all')" >> "${GITHUB_ENV}"
      - name: Check outcomes
        run: |
          [ "${ALL_SUCCESS}" == true ]

  can-merge:
    name: "Can merge"
    needs:
      - check_paths
      - build-test-lint
      - pre-commit
      - editor-tests
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    # The steps read only the needs context, so the token needs nothing.
    permissions: {}
    runs-on: [self-hosted, static]
    timeout-minutes: 5
    steps:
      # Every need must succeed: on a merge queue entry every job is meant
      # to run, and this run is the one release.yml's CI gate counts. A
      # job that skipped here would let an untested change reach a release.
      - name: Transform outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "ALL_SUCCESS=$(echo "${NEEDS_JSON}" | jq '. | to_entries | map(.value.result == "success") | all')" >> "${GITHUB_ENV}"
      - name: Check outcomes
        run: |
          [ "${ALL_SUCCESS}" == true ]
