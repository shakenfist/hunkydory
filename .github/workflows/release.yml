# Release workflow for hunkydory.
#
# Adapted from shakenfist/development/templates/release-automation/release.yml
# rather than copied verbatim -- that template is written for a Python
# project publishing to PyPI with setuptools_scm and trusted publishers.
# hunkydory is a VS Code extension publishing a .vsix to the VS Code
# Marketplace with a Microsoft Entra ID token minted from this run's own
# GitHub OIDC identity, so this file keeps the template's job shape and
# reasoning where it still applies and deviates where it does not. The
# deviations:
#
# * Only three jobs, not the template's four. The template's sign-tag job
#   Sigstore-signs the release tag with gitsign before publishing. Phase 7
#   of this project's onboarding plan decided a three-job shape (build,
#   publish-marketplace, github-release) and did not consider sign-tag.
#   That is a known gap, not an oversight: hunkydory's release tags are
#   therefore UNSIGNED, where the rest of the fleet's release tags are
#   signed with Sigstore. Revisit this if/when the fleet's tag-signing
#   convention gets applied here.
#
# * All three jobs run on [self-hosted, vm, debian-13-docker, s] rather
#   than the template's [self-hosted, static]. static is a shared,
#   persistent bare-metal pool -- other repositories' jobs run on the
#   same machines between releases -- and each job had its own reason to
#   leave it. publish-marketplace holds a credential that can publish
#   under the shakenfist publisher id, matching the reasoning
#   .github/actionlint.yaml already documents for secret-scan.yml's use
#   of vm + debian-13. build holds no credential, but it produces the
#   .vsix publish-marketplace ships, and an artifact built on a pool with
#   state that outlives the job is reachable by a compromise of that
#   pool; issue #23 is that argument in full. github-release holds
#   contents: write, which is a credential on shared infrastructure by
#   the same reasoning as the first; issue #32.
#
#   The three jobs also now agree on *which* bytes. build publishes the
#   sha256 of the .vsix it produced as a job output, and the other two
#   check what they downloaded against it before publishing or attaching
#   it. Until that existed, the file on the GitHub Release could have
#   differed from the one sent to the Marketplace with nothing to notice.
#   See tools/vsix-digest.sh, which is also clear about what that does
#   not buy: it catches tampering between jobs and ordinary mistakes, not
#   a job that can rewrite both the artifact and the digest.
#
#   The -docker half of that label is not decoration. The plain debian-13
#   lane carries neither node nor npm -- measured in run 35141854203, not
#   assumed -- so the runtime of both jobs comes from a pinned node:22
#   container, started by tools/build-vsix.sh and
#   tools/publish-marketplace.sh respectively, with the digest shared
#   between them in tools/container-image.sh. An earlier revision of this
#   file ran `npm ci` on the plain lane and asserted in a comment that it
#   "carries Debian 13's node 20". That was false, and the job could
#   never have published; phase 7b repaired both.
#
# * publish-marketplace mints its own credential and stores none. There
#   is no VSCE_PAT secret, and no `release` environment secret at all.
#   This job's GitHub OIDC identity is exchanged at Entra for a
#   Marketplace access token that lives about an hour, which is why the
#   job needs `id-token: write` and why the `release` environment carries
#   two non-secret variables instead. tools/marketplace-token.mjs holds
#   that exchange, and its header explains why it does not simply use
#   `vsce publish --azure-credential`.
#
# * publish-marketplace installs, where the template's PyPI job runs no
#   comparable step: it needs the lockfile-pinned vsce binary. See
#   tools/publish-marketplace.sh for why that install uses
#   --ignore-scripts, since the plan text this workflow implements says
#   simply "no npm ci".
#
# See RELEASE-SETUP.md for one-time configuration steps.
#
# Template source: shakenfist/development/templates/release-automation/

name: Release

permissions: {}

on:
  push:
    tags:
      - 'v*'

  # Allow manual trigger for testing. github.event_name == 'push' in the
  # guards below means a workflow_dispatch run only ever exercises the
  # build job -- it never publishes, whether or not it's aimed at a tag.
  workflow_dispatch:

jobs:
  build:
    name: Build the .vsix
    # Not [self-hosted, static], and not because of the credential --
    # there is none in this job. The .vsix the publish job ships is
    # produced here, and static is the persistent pool shared by every
    # repository in both organisations, so a compromise of it reached the
    # artifact even where it could not reach the token. Issue #23. Same
    # ephemeral VM lane as publish-marketplace below, for the same reason
    # and with the same consequence: the lane carries neither node nor
    # npm, so the runtime comes from the pinned container that
    # tools/build-vsix.sh starts.
    runs-on: [self-hosted, vm, debian-13-docker, s]
    # Longer than it was on static, because this one pulls a container
    # image before it installs anything. Matches publish-marketplace.
    timeout-minutes: 15

    permissions:
      contents: read

    # The digest of the .vsix this job produced, so the two jobs that
    # consume it can check they got the same bytes. See
    # tools/vsix-digest.sh and issue #32.
    outputs:
      vsix_sha256: ${{ steps.digest.outputs.vsix_sha256 }}

    steps:
      # persist-credentials: false for the same reason
      # publish-marketplace sets it, and one this job did not have
      # before: tools/build-vsix.sh bind-mounts the whole checkout into
      # the container, .git included, and actions/checkout otherwise
      # leaves an AUTHORIZATION header for GITHUB_TOKEN in .git/config
      # where every package in the tree could read it. Nothing after the
      # checkout uses git.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No npm cache step here, unlike ci.yml: npm runs inside a
      # container whose cache is its own /tmp, and the workspace does not
      # outlive the run, so there is no shared ~/.npm on the host to keep
      # out of.
      #
      # The script does the work, rather than a run: block, because the
      # fleet keeps CI logic longer than a few lines in tools/. It starts
      # the pinned container, checks the tag against package.json,
      # installs with --ignore-scripts and runs `npm run package`. The
      # reasons for each live in the script, because that is where
      # somebody changing them will be.
      #
      # HUNKYDORY_RELEASE_TAG is the tag being released, or empty. Empty
      # skips the version check, which is what a workflow_dispatch run
      # wants: it has no tag to check against. The script requires the
      # variable to be *set* even when empty, so that deleting or
      # mistyping this key fails the job rather than silently disabling
      # the check -- "not a release" and "the env: block broke" would
      # otherwise be the same signal.
      #
      # Passed by environment rather than interpolated into a run:
      # block, so a ref name is never shell input.
      - name: Build the .vsix
        env:
          HUNKYDORY_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: ./tools/build-vsix.sh

      # Recorded before the upload rather than after, so the value
      # describes the file this job built rather than whatever came back
      # out of the artifact store.
      # Two lines rather than one `echo "k=$(...)"`, and the difference
      # matters: under `bash -e` a command substitution that fails inside
      # an echo does not fail the step, because echo itself succeeds. This
      # job would have gone green having published an empty digest, and
      # the error would have surfaced two jobs later in the one holding
      # the publishing credential. The assignment form propagates the exit
      # status.
      - name: Record the .vsix digest
        id: digest
        run: |
          digest=$(./tools/vsix-digest.sh .)
          echo "vsix_sha256=${digest}" >> "$GITHUB_OUTPUT"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'

  publish-marketplace:
    name: Publish to the VS Code Marketplace
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, vm, debian-13-docker, s]
    environment: release
    # Longer than the other jobs, because this one pulls a container
    # image before it installs anything.
    timeout-minutes: 15

    # Least privilege, with one addition. This job never writes to the
    # repository; it reads it for package.json and package-lock.json, to
    # install the pinned vsce. `id-token: write` is what lets the job ask
    # GitHub for the OIDC token it exchanges at Entra -- without it the
    # ACTIONS_ID_TOKEN_REQUEST_* variables are simply absent and
    # tools/publish-marketplace.sh fails saying so. Despite the name it
    # grants no write access to anything in the repository.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No npm cache step here, unlike ci.yml: npm runs inside a
      # container whose cache is its own /tmp, so there is no shared
      # ~/.npm on the host to keep out of. Same as build, above.

      - name: Download .vsix artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix/

      # Before the credential is anywhere near it. What reaches the
      # Marketplace under the shakenfist publisher id should be the bytes
      # build produced and nothing else; this is where that stops being
      # an assumption. Issue #32.
      - name: Check the artifact is the one build produced
        env:
          EXPECTED_VSIX_SHA256: ${{ needs.build.outputs.vsix_sha256 }}
        run: ./tools/vsix-digest.sh "${RUNNER_TEMP}/vsix" "${EXPECTED_VSIX_SHA256}"

      # The script does the work, rather than a run: block, because the
      # fleet keeps CI logic longer than a few lines in tools/.
      # It starts the pinned node:22 container, installs with
      # --ignore-scripts, mints the Marketplace token from this run's
      # OIDC identity, and publishes with --packagePath. Each of those
      # has a reason, and the reasons live in the script rather than
      # here, because that is where somebody changing them will be.
      #
      # Both variables below are environment *variables* on the
      # `release` environment, not secrets: a client id and a tenant id
      # identify the app registration, they do not authenticate as it.
      # What authenticates is the OIDC token GitHub mints for this job,
      # which Entra accepts only for the subject
      # repo:shakenfist/hunkydory:environment:release. Note what that
      # subject does NOT contain: a ref. An environment-scoped subject
      # names the environment and nothing else, so Entra cannot tell one
      # ref from another.
      #
      # Three things bind this job to `v*` tags -- the trigger above, this
      # job's `if:`, and the `release` environment's tag rule -- and the
      # third is the one an edit to this file cannot remove. But none of
      # them constrain who may create the tag, and since Entra cannot see
      # the ref, tag-creation permission is publish permission. That is a
      # repository ruleset, tracked as issue #21. See RELEASE-SETUP.md.
      - name: Publish to the VS Code Marketplace
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: ./tools/publish-marketplace.sh "${RUNNER_TEMP}/vsix"

  github-release:
    name: Create GitHub Release
    needs: [build, publish-marketplace]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # The last job to come off [self-hosted, static], and the one whose
    # case for it was weakest: it holds contents: write, which on a pool
    # shared with every other repository in both organisations is a
    # credential sitting where other repositories' jobs run. It needs no
    # docker itself -- the actions below are JavaScript and run on the
    # runner's own bundled node -- but it shares the lane with build and
    # publish-marketplace so that release.yml names one runner and
    # nothing here runs on static at all. Issue #32.
    runs-on: [self-hosted, vm, debian-13-docker, s]
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      # This job used to skip the checkout, on the reasoning that
      # action-gh-release reads an absolute runner.temp path happily and
      # a checkout was a cost with nothing to buy. It now has something
      # to buy: tools/vsix-digest.sh, which is the thing that makes the
      # attached file provably the published one.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download .vsix artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix/

      # The Release asset is what RELEASE-SETUP.md offers as the copy of
      # what shipped, downloadable without going through the Marketplace.
      # That claim is only worth anything if the two are the same bytes,
      # and until this step nothing compared them. Issue #32.
      - name: Check the artifact is the one that was published
        env:
          EXPECTED_VSIX_SHA256: ${{ needs.build.outputs.vsix_sha256 }}
        run: ./tools/vsix-digest.sh "${RUNNER_TEMP}/vsix" "${EXPECTED_VSIX_SHA256}"

      # fail_on_unmatched_files because action-gh-release treats a glob
      # that matches nothing as a warning, so without it a release that
      # attached no files at all would still report success.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/vsix/*.vsix
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
