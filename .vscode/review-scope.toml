# Which files are subject to whole-file review (see
# shakenfist/development docs/code-review-tracking.md). Patterns are
# fnmatch-style against repo-relative paths; '*' matches across
# directory separators.
#
# The first phase (see "Human review onboarding" in
# https://github.com/shakenfist/development/blob/main/docs/plans/PLAN-typescript-onboarding.md,
# a plan in the development repository rather than this one) scoped
# review deliberately narrowly to hunkydory's TypeScript source and
# its tests, because that is the code an agent wrote start to finish
# and the operator had not read any of it. Scope has since widened to
# the files that decide what ships and how: everything under
# `.github/` (the CI and release workflows, and the actionlint config
# that constrains them), the README that is the project's pitch,
# RELEASE-SETUP.md, which is the runbook for the credentials and
# environment protections behind Marketplace publishing, and the
# `tools/` shell scripts. The shell scripts are executable artifacts
# in the same sense the TypeScript is, and ci-prune-reviews.sh in
# particular runs in CI against develop and commits back to it, so it
# belongs with the workflows that invoke it rather than a tier below
# them.
#
# `docs/` joins them now. It is the prose half of the same artifact:
# docs/hunk-format.md and docs/ambiguity.md are what someone reads
# before touching `resolveCounts`, and AGENTS.md sends them there by
# name. Prose that has drifted from the code misleads precisely the
# reader the code is hardest on, and nothing else catches that --
# there is no test or linter for a stale explanation, only somebody
# reading it against the source. Review marks expire on change, so a
# doc edited to match new behaviour comes back for a fresh read the
# same way src/diff.ts does.
#
# `test/fixtures/*` is in for the same reason the TypeScript is, even
# though the files are data rather than code. A fixture asserts that an
# exact sequence of bytes survives recounting untouched, so its value
# is entirely in whether it is right -- nothing catches a fixture that
# encodes the wrong answer except somebody counting it by hand. The
# first one is a CRLF patch, and the whole point of it is bytes that do
# not show up in a diff.
include = [
    'src/*.ts',
    'test/*.ts',
    'test/fixtures/*',
    '.github/*',
    'README.md',
    'RELEASE-SETUP.md',
    'docs/*',
    'tools/*',
]

# Named by category, not left for `include` to decide by omission: a
# file type matching neither list fails review-scope-completeness, so
# a new one still has to be a decision. LICENSE is verbatim upstream
# text and would never move to `include`.
#
# 'out/*' is the tsc build output, and is named here even though
# .gitignore means review-scope-completeness would never ask about it,
# because "it is generated" is not the whole reason and the next
# person to look at out/src/diff.js deserves to find the rest of it
# written down. The attestation cannot work there: the model binds
# reviewer, date and blob SHA in a signed commit, and an untracked
# file has no blob, so `stamp` records nothing and `prune` can never
# expire the mark. A review of generated JS would therefore survive
# every recompile forever, which is a worse claim than no claim at
# all. Nor is it the code that ships -- the release workflow's `npm
# run package` runs vscode:prepublish, so the .vsix is compiled fresh
# from src/*.ts, which is in scope, by a workflow which is also in
# scope. Any defect visible in out/ is either a defect in the
# TypeScript or a tsc bug. Half the tree is .js.map besides, which is
# base64 VLQ and readable by nobody. The right control for the
# supply-chain worry here is a reproducible-build check, not a human
# reading compiler output.
#
# The '!' entries are re-includes, putting back a file that a broader
# pattern on this list takes away: README.md, RELEASE-SETUP.md and the
# docs/ tree are reviewed despite the blanket '*.md' that keeps
# AGENTS.md, ARCHITECTURE.md and PUSH-AUDIT.md out, and
# .github/actionlint.yaml is reviewed despite the blanket '*.yaml'
# that keeps .pre-commit-config.yaml out.
exclude = [
    'out/*',
    '*.md',
    '!README.md',
    '!RELEASE-SETUP.md',
    '!docs/*',
    '*.json',
    '*.yaml',
    '!.github/*',
    '.gitignore',
    '.vscodeignore',
    'LICENSE',
]
