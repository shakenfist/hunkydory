# Declare the self-hosted runner labels this repository's workflows
# name, so actionlint does not flag them as unknown.
#
# hunkydory runs on `static`: the build, the tests and Biome all need
# node, which the static pool gained in 2026-09. `vm` and `debian-13`
# are here for secret-scan.yml, which needs a runner carrying gitleaks;
# `claude-code` for pr-re-review.yml.
#
# `debian-13-docker` is the fleet's docker-capable VM image, and is here
# for release.yml's build and publish-marketplace jobs. Both need a
# docker daemon because plain `debian-13` carries neither node nor npm
# (measured in run 35141854203), so their runtime comes from a pinned
# node:22 container rather than from the image. Adding this label was
# phase 7b's to do, deliberately: phase 7a left it out so that choosing
# the lane stayed a decision rather than a default. `build` joined
# publish-marketplace on it for issue #23: the .vsix that ships should
# not be built on a pool whose state outlives the job.
#
# The bookworm labels are deliberately absent, matching
# shakenfist/development. Debian 12 went end of life on 2026-06-10, and
# leaving `debian-12` undeclared is what gives actionlint something to
# say if it ever creeps into a workflow here.
self-hosted-runner:
  labels:
    - static
    - claude-code
    - vm
    - debian-13
    - debian-13-docker
    - s
