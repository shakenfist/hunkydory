repos:
  # This repository now ships seven workflows and nothing else checks
  # them. actionlint earned its place here immediately: it caught a
  # job-level `env:` block reading the `runner` context, which is not
  # available there and would have resolved to an empty cache path at
  # runtime rather than failing loudly.
  #
  # -config-file points at .github/actionlint.yaml, which declares the
  # fleet's self-hosted labels; without it every `runs-on` here is an
  # unknown label and the hook is noise.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: local
    hooks:
      - id: check-node
        name: build, test and Biome
        entry: ./tools/check-node.sh check
        language: script
        pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^tools/
        types_or: [sh, bash, shell]
        args: ['-x']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Lints the agent context (AGENTS.md and anything else an agent is
  # given) for malformed structure, smuggled instructions and the like.
  # Renovate's pre-commit manager keeps the rev current.
  #
  # This is only half of the fleet's llm-context-lint-ci audit criterion:
  # it also requires a CI route, which phase 5's ci.yml adds by running
  # `pre-commit run --all-files` as a job. Until that phase lands,
  # llm-context-lint-ci stays red for this repository.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.20.0
    hooks:
      - id: skillsaw
