# Which files are subject to whole-file review (see
# shakenfist/development docs/code-review-tracking.md). Patterns are
# fnmatch-style against repo-relative paths; '*' matches across
# directory separators.
#
# This phase (see "Human review onboarding" in
# https://github.com/shakenfist/development/blob/main/docs/plans/PLAN-typescript-onboarding.md,
# a plan in the development repository rather than this one) scopes
# review deliberately narrowly to hunkydory's
# TypeScript source and its tests, because that is the code an agent
# wrote start to finish and the operator has not read any of it yet.
# Everything else is excluded below, not because it does not matter,
# but so the review queue starts as exactly the files that need a
# first pass. Widening scope later is a one-line addition here and
# needs no migration -- a newly in-scope file simply has no review
# mark and joins the `next` queue like any other unreviewed file.
include = ['src/*.ts', 'test/*.ts']

# Named by category, not left for `include` to decide by omission: a
# file type matching neither list fails review-scope-completeness, so
# a new one still has to be a decision. CI workflow YAML, the docs
# tree, and the tools/ shell scripts are all plausible candidates for
# a later phase to bring into scope; for now they are out. LICENSE is
# verbatim upstream text and would never move to `include`.
exclude = [
    '.github/*',
    'docs/*',
    'tools/*',
    '*.md',
    '*.json',
    '*.yaml',
    '.gitignore',
    '.vscodeignore',
    'LICENSE',
]
